[package]
name = "tftp-rs"
version = "0.3.2"
edition = "2024"
description = "A high-performance TFTP server with a TUI dashboard"
license = "MIT"
authors = ["Mateusz Hajder"]
readme = "README.md"
repository = "https://github.com/mhajder/tftp-rs"
keywords = ["TFTP", "server", "TUI", "dashboard", "Rust"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "tftp_rs"
path = "src/lib.rs"

[features]
default = ["tui"]
tui = [
    "dep:axum",
    "dep:clap",
    "dep:crossterm",
    "dep:if-addrs",
    "dep:ratatui",
    "dep:tokio-util",
]

[[bin]]
name = "tftp-rs"
path = "src/main.rs"
required-features = ["tui"]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", optional = true }
clap = { version = "4.6.0", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
if-addrs = { version = "0.15", optional = true }
ratatui = { version = "0.30", optional = true }
socket2 = "0.6.3"
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"], optional = true }

[dev-dependencies]
tempfile = "3"
